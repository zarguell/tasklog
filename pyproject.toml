[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tasklog"
version = "1.0.0"
description = "Markdown-based project ledger CLI — TODO.md + log.md + context/"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tasklog = "meta:cli"

[tool.setuptools.packages.find]
include = ["meta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
